; =====================================================================================================
; OAI TWEAKS SANITIZER (created for OAI TWEAKS) - by DucMeister – v2.31a Compatible
; =====================================================================================================
;
; PHILOSOPHY: OAI is designed to stabilize the vanilla engine pipeline. 
; The mod operates in two stages: OPTIMIZATION and SANITIZATION.
;
; OAI TWEAKS is divided into three parts:
;
; Part 1 - [USER ADJUSTABLE SETTINGS] - Optimized parameters for system-specific fine-tuning.
; Part 2 - [ENGINE ADVANCED TUNING]   - Hard-coded optimizations that should remain untouched.
; Part 3 - [ENGINE SANITIZER]         - Parameters enforced to CDPR defaults
;
; This file contains the [ENGINE SANITIZER] portion. By enforcing original values, 
; OAI ensures the engine operates from a predictable, stable baseline. 
; Separating these into a standalone file allows users to manage or remove specific 
; entries for compatibility with other mods.
;
; IMPORTANT: This file enforces baseline values that may override settings from other mods.
; 			 It does NOT guarantee full compatibility with script-based mods (CET / RedScript).
; -----------------------------------------------------------------------------------------------------
; [QUICK GUIDE FOR USERS]
; 1. WHAT IS THIS? This file resets critical engine settings to their original stable values.
; 2. WHY? To reset leftover, conflicting, or broken settings from other mods.
; 3. COMPATIBILITY: This file has priority. If you want another mod to control a specific setting:
;    --> Just DELETE the corresponding line in this file. 
;    --> Or add a ";" at the beginning of that line.
;
; If you don't know what a setting does, LEAVE IT AS IS. It is already set to the safest default.
; =====================================================================================================


; ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
; PART 3 - [ENGINE SANITIZER - SAFE DEFAULTS]
; These lines prevent other mods from forcing unstable values.
; To let another mod take control: DELETE the corresponding line below or add a ";" to disable it.
; ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

[AI]
CodeTweakActionsEnabled = true							; Same as default - enables minor AI code path optimizations, improving stability and NPC behavior consistency.
LOD0TickRate = 1										; Same as default - updates every frame, ensures nearby AI is fully responsive.
LOD1TickRate = 4										; Same as default - ticks less often than LOD0 and reduces CPU load for mid-range AI.

[Crowd]
ZCutoffEnabled = true                                   ; Same as default - Enables the Z-axis cutoff logic to optimize performance in multi-layered urban environments.

[Editor/Streaming]
ForceAutoHideDistanceMax = 16384.000000 				; Same as default - Provides the most stable memory footprint for all GPUs while working in harmony with the default 23k Engine Streaming limit.

[Occlusion]
SortDist0 = 140.000000 									; Same as default (140) - Prioritizes CPU frame-pacing over extended occlusion sorting, ensures maximum stability with threading logic.
SortDist1 = 200.000000 									; Same as default (200) - Keeps draw call overhead within safe limits for smooth frame delivery and prevent hitching in dense areas.
SortDist2 = 260.000000 									; Same as default (260) - Balanced distance to maintain stability with threading logic, prevents streaming spikes in high-density areas.

; Reverted to Vanilla defaults (previous OAI versions used a +5% increase). This ensures maximum CPU headroom for the new 1/1/1 Threading, Particle, and Culling logic.
; NOTE: Keeping these values at default prevents streaming spikes and hitching in dense areas (e.g., Dogtown) while the engine synchronizes high-priority assets on the optimized threading model.

[Rendering]
LightRadiusWarningTreshold = 20.000000					; Same as default – developer/debug setting (no impact on gameplay performance)
MaxGbufferSplits = 8									; Same as default – Prevents VRAM fragmentation stutters on all GPUs (especially 8GB/12GB cards); Essential for long-session stability and consistent frame-pacing.

[Rendering/AsyncCompute]
BuildDepthChain = true									; Same as default -  Enables async compute path for depth buffer generation – reduces GPU main queue pressure.
DPL = true												; Same as default -  Enables Decoupled Pipeline Layout – improves scheduling of GPU workloads (mostly beneficial on RTX cards).
DynamicTexture = true									; Same as default -  Offloads dynamic texture operations to async queue – smoother streaming of animated/interactive textures.
ExposureScaleBuffer = true								; Same as default -  Processes exposure data asynchronously – helps stabilize auto-exposure during fast lighting changes.
ExtendedDuringSSR = true								; Same as default -  Uses async compute during Screen Space Reflections – reduces SSR-related GPU hitches.
FlattenNormals = true									; Same as default -  Flattens normals asynchronously – improves shading performance with minimal visual cost.
HairClears = false										; Same as default -  Set to false to avoid hair flickering, reduce GPU overhead and ensure compatibility with VR mods.
LutGeneration = true									; Same as default -  Enables async LUT (color grading) generation – minor performance gain during lighting transitions.
RaytraceASBuild = true 									; Same as default -  Offloads RT structure building to async queue - vital for RT users.
SSAO = true												; Same as default -  Allows Ambient Occlusion to use async compute – improves performance in shaded or crowded scenes.

; These settings are safe and beneficial on any modern GPU (Nvidia RTX / AMD RDNA / Intel Arc), improving utilization - especially when using texture mods or ray tracing.
; Older GPUs (e.g., Nvidia Pascal) may not benefit from async compute.

[Rendering/LUT]
MaxRange = 100.000000									; Same as default – good for color range.
MinRange = 0.001000										; Same as default – preserves contrast.
Size = 48												; Same as default – keeps color precision as intended, has no impact on performance.

[Rendering/MeshLoading]
ForceSyncMeshLoading = false 							; Same as default - keep async mesh loading to avoid blocking the render thread and causing hitches.

[Rendering/VariableRateShading]
Enable = true											; Same as default - Enables Variable Rate Shading (VRS) for performance optimization - Kept enabled for better performance without noticeable quality loss.
MotionFactor = 0.750000									; Same as default - Determines how motion affects VRS. Kept at 0.75 for a balance between performance and motion smoothness.
ScreenEdgeFactor = 1.000000								; Same as default - Controls shading on the screen edges. Kept at 1.0 to maintain edge quality.
ShowOverlay = false										; Same as default - Disables VRS performance overlay, reducing unnecessary UI rendering.
VarianceCutoff = 0.025000								; Same as default - Defines the threshold for VRS. Left unchanged at 0.025 for optimal visual quality with minimal impact.

[SnapToTerrainIk]
TraceAboveGroundDistance = 0.500000						; Same as default - Defines the maximum distance to trace above the terrain for snap-to-ground functionality. Left at 0.5 (same as default) for proper ground snapping.
TraceBelowGroundDistance = 0.500000						; Same as default - Defines the maximum distance to trace below the terrain. Left at 0.5 (same as default) to ensure smooth snap-to-ground without excessive checks.

[Streaming]
DistanceBoost = 0.000000 								; Same as default - Ensures stability, as values higher than 0.0 break mesh-to-proxy transitions, causing visual flickering/holes.
MaxStreamingDistance = 23170.251953						; Same as default - Reverted to default to restore full Depth Buffer precision and shadow definition; Fixes possible "soft shadows" and lighting flatness issues.
StreamingEnabled = true									; Same as default - ensures streaming system is active, if disabled it would break world loading on some setups.
TimeLimitSectorUnloadPerFrame = 1.000000 				; Same as default - ensures old sectors unload promptly to free memory without causing buildup or VRAM pressure.
ObserverVelocityOffsetEnabled = false					; Same as default - Disables unnecessary calculations for velocity offset, reducing processing overhead.
ObserverMaxOnFootForwardVelocity = 5.000000				; Same as default - Defines the maximum forward velocity when on foot. Lower values for more responsive and fluid movement.
ObserverMaxNonAirVehicleForwardVelocity = 20.000000		; Same as default - Defines max forward velocity for non-air vehicles. Left at 20.0 for smooth vehicle movement.
ObserverMaxAirVehicleForwardVelocity = 0.000000			; Same as default - Sets forward velocity limit for air vehicles to 0. Disables unnecessary calculations for air vehicles (same as default).

[Streaming/Culling]
Enabled = true											; Same as default - activates culling system, improves performance by ignoring unseen objects.
ForceSSDMode = 0										; Same as default - to restore in-game options control (managed through game settings) and avoid redundant overrides.
OnlyIfSingleObserver = true								; Same as default - improves performance when only the player character is active (common case).
VisibilityQuery = true									; Same as default - enables visibility-based culling for better streaming accuracy.
Strict = false											; Same as default - non-strict culling behavior, it avoids aggressive culling that can increase pop-in and flicker, especially on mid-range systems.

[Streaming/Culling/AutoHideDistanceNear]
Enabled = true											; Same as default - hides small objects close to the camera when not needed, improves GPU performance.

[Streaming/Culling/DynamicSphere]
Enabled = true											; Same as default - enables dynamic culling based on camera movement, reduces stutter during rapid movement.

[Streaming/Culling/Fallback]
Enabled = true											; Same as default - enables fallback system for missed streaming, prevents visual gaps in edge cases.

[Streaming/Culling/StaticDecals]
FlatDecalDistance = 20.0								; Same as default - balanced setting for flat decals, remaining visible for improved world consistency.

[Streaming/Editor]
TimeLimitDetachingPerFrame = 10.000000 					; Same as default - ensures the engine releases unused assets from memory efficiently without causing frame-time spikes during the "cleanup" process.

[Streaming/QueryZoom]
Enabled = false											; Same as default - Disables zoom query feature to avoid stutter during zoom actions.
MaxSpeed = 2.000000										; Same as default - Controls the maximum speed during zoom. Not needed when zoom queries are disabled.
MaxZoomFactor = 4.000000								; Same as default - Controls zoom factor. Not needed when zoom queries are disabled.
MinActivationZoomFactor = 2.000000						; Same as default - Defines the minimum zoom factor to activate zoom queries. Not needed when zoom queries are disabled.

[TargetTracking]
VariableTickRateEnabled = true							; Same as default - Kept enabled as it saves CPU cycles dynamically.

