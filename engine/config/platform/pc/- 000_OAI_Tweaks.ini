; ==========================================================================================================
; OAI TWEAKS v1.26 - by DucMeister - Engine.ini Override – v2.31a Compatible
; ==========================================================================================================
; FOR GAMING DESKTOPS & LAPTOPS ONLY - DO NOT USE WITH HANDHELD/MINIPC DEVICES
; ----------------------------------------------------------------------------------------------------------
; Optimization tweaks designed to improve CPU/GPU utilization, RAM management, and I/O streaming efficiency.
; Provides overall smoothness and better frame-pacing without breaking immersion, detail, or AI logic. 
;
; PHILOSOPHY: OAI is designed to stabilize the vanilla engine pipeline. 
; The mod operates in two stages: OPTIMIZATION and SANITIZATION.
;
; OAI TWEAKS is divided into three parts:
;
; Part 1 - [USER ADJUSTABLE SETTINGS] - Optimized parameters for system-specific fine-tuning.
; Part 2 - [ENGINE ADVANCED TUNING]   - Hard-coded optimizations that should remain untouched.
; Part 3 - [ENGINE SANITIZER]         - Parameters enforced to CDPR defaults (see separate Sanitizer file).
;
; This file contains the [USER ADJUSTABLE SETTINGS] and [ENGINE ADVANCED TUNING] portions. 
; ----------------------------------------------------------------------------------------------------------
; [QUICK GUIDE FOR USERS]
; 1. STRUCTURE: Part 1 contains settings you can change. 
;               Part 2 contains engine core settings not to be changed.
; 2. FINE TUNING: Every setting in Part 1 is explained. Read the notes and adjust to your needs.
; 3. TESTING: 
;    --> Change a value, save the file, and test it in-game.
;    --> Heavy areas like Dogtown or dense markets are good for testing.
;    --> No improvement? Just revert to the original OAI value.
;
; If you are unsure about a setting, stick to the OAI defaults. Afterall, they are meant to be balanced.
; ==========================================================================================================


; +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
; PART 1 - [USER ADJUSTABLE SETTINGS]
; Fine tuned parameters for OAI that you can readjust according to your hardware and needs.
; These are set and pre-configured in OAI for instant compatibility with most systems.
; However, to unlock the full potential for your specific hardware, you can (should) readjust them.
; Simply follow the notes provided for each parameter.
; +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

[AI]
EnableLowFPSDetection = false

; [OAI DEFAULT: false] Disables the engine's dynamic AI scaling, ensuring consistent frame-times and also visual consistency (no more NPCs suddenly moving like stop-motion). 
; It prevents the engine from "panicking" and constantly shifting AI LODs/animation tickrates during minor FPS fluctuations, avoiding glitches. 
; NOTE: setting to "true" may help CPU-bound crowd spikes as it aggressively lowers NPC quality and animation smoothness to save FPS, but causes visible NPC "popping"/choppy movements and inconsistent frame-times.

LOD2BucketSize = 48

; [OAI DEFAULT: 48] Set for best balance of performance versus smooth transitions for mid-range LODs at distance (default is 16).
; Higher value improves transitions for crowds, ambient traffic, and distant structures, but will impact performance on mid-range hardware.
; NOTE: If you have a lower-end system, you may try decreasing this to 32 or 24. If you have a high-end system, you may try increasing it to 64 or 96.

LOD2TickRate = 10
LOD3TickRate = 20

; [OAI DEFAULT: 10 / 20] Set for best balance of performance versus quality (ticks less frequently than default 8 / 16).
; This controls not only crowds but also cloth physics (flags/banners) and distant environmental animations; 
; Higher values save CPU power by updating distant movements less frequently (can look "choppy"); Lower values improve movement fluidity but increase CPU usage. 
; NOTE: For lower-end systems, you may try 14 / 24. For high-end systems, you may try 6 / 14.

[CrowdMovement]
EnableDirectionSmoothing = true

; [OAI DEFAULT: true] Set to ensure that NPCs have smooth and natural turning animations (kept same as default).
; ADVISORY: only set this to "false" if you need to reduce CPU usage further, but be warned: NPCs may look robotic in dense areas like markets, clubs or parties.

[Editor/MipBias]
EnableCustomMipBias = false
ForceCustomMipBias = 0.0

; [OAI DEFAULT: false / 0.0] Recommended to keep this set to "false" so DLSS/FSR/XeSS can manage texture offset dynamically.
; Manually forcing negative values (like -0.75 or -1.5) can provide "extra sharpness" but often causes heavy shimmering, aliasing on fine textures (wires, fences), and conflicts with the upscaler's internal logic.
; ADVISORY: only set to "true" and adjust ForceCustomMipBias to a desired negative value if you are playing at native resolution or find the image too blurry even with upscaler sharpening.

[Rendering/AsyncCompute]
Enable = true

; [OAI DEFAULT: true] Primary toggle for enabling parallel GPU operations. Keep "true" for all modern GPUs (Nvidia RTX, AMD RDNA, Intel Arc).
; This allows the engine to execute compute tasks (shadows, lighting, SSAO) in parallel, reducing bottlenecks and improving frame-time consistency.
; NOTE: If using GTX 10-series (Pascal) or older, set to "false" to avoid potential stuttering, as these older architectures can struggle with concurrent compute tasks.

[Rendering/Video]
MaxFrameUploadMB = 13107200

; [OAI DEFAULT: 13107200] Balanced "pipeline" (~12.5MB) to fit the most popular GPUs (8GB and 12GB VRAM) and beyond. 
; This controls how much texture data can be uploaded to the GPU in a single frame. Higher values make texture loading faster/smoother but can cause "frame-time spikes" if the VRAM is nearly full.
; HIGH-END ADJUSTMENTS:
; 20971520 (~20MB) - Recommended for 16GB VRAM GPUs.
; 31457280 (~30MB) - Recommended for 24GB+ VRAM GPUs.
 
[ResourceLoaderThrottler]
DedicatedDecompressionMemoryBytes = 16777216

; [OAI DEFAULT: 16777216] Set to a 16MB decompression buffer (increased from default 1MB) to improve streaming throughput and reduce stalls.
; Larger buffers help with 4K texture mods, but excessively high values can overload the streaming queue and increase pop-in risk.
; HIGH-END ADJUSTMENTS (for systems with NVMe Gen4+ and 16GB+ VRAM):
; 33554432 (32MB buffer) - Recommended for heavy mod lists.
; 67108864 (64MB buffer) - Extreme setting for high-end rigs with 4K texture packs.

FloodMinNonLoadingThreads = 1
StreamMaxLoadingThreads = 1
TrickleMaxLoadingThreads = 1

; [OAI DEFAULT: 1/1/1] Tuned for lowest latency by streamlining the engine's I/O path. More threads ≠ better performance. 1/1/1 delivers the best frame-pacing while preventing engine stalls and scheduling conflicts.
; ADVISORY: Only change these if you experience severe asset pop-in or run many heavy apps in the background (Discord, browsers with many tabs).
; If needed, try these specific combinations only:
; 2 / 1 / 1 (Slightly less aggressive, safer for multitasking users)
; 2 / 2 / 1 (CDPR default - safe but introduces some micro-jittering)

[Streaming]
PrecacheDistance = 0.0

; [OAI DEFAULT: 0.0] Set for engine's native dynamic streaming logic, and strongly recommended for NVMe Gen3/Gen4/Gen5 drives for most efficient asset management, stable default for all upscalers.
; ADVISORY: this should only be used/changed with legacy SATA SSDs or very slow CPUs, for which you can try 4.0 as a fixed value. 

[World/Streaming/PersistencyCache]
MaxEntriesPerPage = 32
PoolBudgetKB = 12288

; [OAI DEFAULT: 32 / 12288]
; Balanced baseline tuned for engine behavior. Increased over vanilla (8 / 4096).
; Controls how many object states the engine "remembers". Higher values improve persistence and reduce flickering/pop-in, but also increase validation cost and cache pressure.
; This system does NOT scale linearly with system RAM. Performance is primarily limited by CPU-side overhead (validation cost, cache locality, and streaming behavior).
;
; RECOMMENDED FINE-TUNING RANGES:
; MaxEntriesPerPage = 24 / PoolBudgetKB = 12288 - slightly lower persistence (may help on lower-end systems)
; MaxEntriesPerPage = 32 / PoolBudgetKB = 12288 - best overall balance (recommended for most systems)
; MaxEntriesPerPage = 32 / PoolBudgetKB = 16384 - same persistence with a slightly larger pool (may benefit some systems, but not universally)
;
; Observed behavior for MaxEntriesPerPage values:
; 8 to 16  = insufficient persistence (visible pop-in / state loss)
; 24 to 32 = optimal range (best balance of stability and performance)
; Above 32 = diminishing returns; may introduce stutter or streaming hitches depending on the system
;
; Observed behavior for PoolBudgetKB (persistence memory pool):
; too low (below 12288) → uneven frametime / cache starvation
; too high (above 16384) → may introduce stutter during area transitions (increased flush/management overhead)


; ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
; PART 2 - [ENGINE ADVANCED TUNING] - NOT RECOMMENDED TO CHANGE (OR CHANGE AT YOUR OWN RISK)
; Fixed tweaks designed for better frame-time stability and resource management. 
; Modification of these values is NOT recommended.
; If you are not familiar with these parameters, it is STRONGLY recommended to leave them unchanged.
; ++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

[AI]
LOD0BucketSize = 10										; Set to a defined limit instead of heuristics (default is 0) – keeps the closest/highest LOD NPC group smaller for better CPU load control.
LOD1BucketSize = 32										; Moderate group size for mid-distance AI (default 16) – balances detail and performance.
LODUpdatePeriod = 1.500000								; Lowers LOD group reshuffling frequency (default is 1.0) – reduces CPU load from constant LOD shuffling.

; This block prioritizes performance and stability without breaking AI behavior; Design goal: predictable workload, frame-time stability, and reduced CPU spikes in dense areas.
; LOD*BucketSize values enforce explicit per-frame processing limits; In REDengine, 0 often represents dynamic/engine-managed behavior, not necessarily true “unlimited”.

[Crowd]
MinStreamingVelocityNormalizedToBlockSpawn = 15.000000	; (Increased, default 10) Prevents the engine from spawning new NPCs while driving at high speeds, reducing streaming stutter during fast travel.
ZCutoff = 15                                            ; (Decreased, default 20) Helps the CPU ignore NPCs on floors far above or below the player without affecting visible density or breaking quests.

[CrowdMovement]
FearSpreadRadius = 5.000000                             ; (Decreased, default 10) Limits the distance at which panic spreads. Fewer NPCs enter flee states simultaneously during combat, preventing massive CPU spikes.
LaneLightsRecognitionDistance = 15.000000               ; (Decreased, default 25) Reduces the distance at which NPCs react to traffic lights, lowering the number of active AI agents the CPU has to track.
MaxDirectionChangeAttempts = 3                          ; (Decreased, default 4) Limits how many times an NPC tries to reroute around obstacles. Optimizes pathfinding without causing NPCs to get stuck or act unnaturally.

[Crowds]
EnterWorkspotDelay = 20.000000                          ; (Increased, default 10) Extends the decision timer for NPCs to interact with world objects (workspots) to reduce CPU spikes from frequent AI state transitions.

[LevelOfDetail]
DecalsHideDistance = 35.000000							; Shorter than default (40.0), improves performance while still with negligible decal pop-in.
DynamicDecalsHideDistance = 25.000000					; Higher than default (20.0), keeps dynamic decals visible slighty longer, improving consistency with no performance impact.

[Rendering]
RainMapBatchMaxSize = 150								; Reduced – lighter GPU load, especially during storms (default is 300).
RainMapBatchMaxTrianglesPerBatch = 100000				; Reduced – limits GPU overload on rain mesh rendering (default is 200000).
DistantShadowsMaxBatchSize = 250						; Reduced – fewer shadows per frame, improves GPU frame pacing (default is 500).
DistantShadowsMaxTrianglesPerBatch = 250000				; Reduced – reduces distant shadow overhead (default is 400000).

[Rendering/LateVSAlloc]
Grass = 12												; Reduced from 28 – trade-off for more FPS in open world, 12 provides good grass detail without GPU waste.
Hair = 12												; Reduced from 28 – Hair physics/detail is heavy at 4K, 12 gives performance gain, minor fidelity loss in close-ups.
Particles = 12 											; Reduced from 28 – in combat and environmental scenes, 12 is balanced for smooth effects without excessive GPU overdraw.
Terrain = 12 											; Increased (default is 0 and causes terrain pop-in). 12 gives better terrain mesh quality and improves mesh consistency with minimal GPU footprint.
Trees = 24												; The default 50 is overkill. 24 is visually clean enough, looks good and reduces draw call pressure.

; LateVSAlloc parameters control vertex allocation priority and scheduling.
; Lower values favor throughput and reduced stalls, but may introduce visual trade-offs under extreme streaming stress.
; Goal and design choice: configuration set here was considered the best balance after experimentation, is performance-oriented and frame-time stability focused.

[Rendering/MeshLoading]
AutoRefreshTime = 0.066 								; Checks meshes ~15x per second (default ~10x). Faster LOD refresh reduces pop-in and improves responsiveness while maintaining balanced streaming workload.
LoadingDelay = 0.1 										; Small delay (~100 ms) between mesh load requests to smooth streaming bursts and reduce frame-time spikes during traversal.

[Rendering/Particles]
MaxNoRenderSimTime = 8.000000							; Lower than default (100.0) – stutter free, and more than enough to preserve particle continuity when you turn around or move back quickly.
MaxOffscreenSimTime = 0.800000							; Lower than default (2.0) – improves performance, less time simulating offscreen particle effects that are out of view.
OffscreenUpdateFrequency = 4							; Increased (default is 3) - updates offscreen particles every 4 frames (~15/sec at 60fps), balances CPU efficiency with particle responsiveness.

; These settings help eliminate restarting hitches from particle effects when panning the camera or re-entering busy areas (e.g. markets, combat), preventing "resets" while maintaining high CPU efficiency.

[Streaming]
MaxStreamingObserverHeight = 4.000000					; Slightly higher than default (3.0) – helps when in vehicles or elevated positions like overpasses.
MinStreamingDistance = 20.000000						; Higher than default (1.0) reduces stutter from constant asset swaps near the camera; 20 = best balance, 25+ = better performance but more pop-in.
MaxNodesPerFrame = 500									; Increased from default (300) - balanced for majority of modern gaming systems (desktops/laptops), good compromise for most CPUs.
EditorThrottledMaxNodesPerFrame = 850					; Increased from default (500) - maintains similar ratio of CDPR for runtime/loading transitions. Safe during loading screens, improved editor performance.
MaxNodesPerFrameWHileLoading = 65536					; High but safe limit for fast loading (2^16 aligned), avoids instability from extreme values.
TimeLimitAttachingPerFrame = 0.625000					; Increased 25% from default (0.5) to reduce pop-in by allowing more time for smooth asset attachment with low stuttering risk on modern CPUs.
TimeLimitSectorLoadPerFrame = 2.500000 					; Increased from default (2.0) to allow faster sector loading and reduce pop-in during area transitions.
TimeLimitStreamedPerFrame = 8.000000 					; Increased from default (6.0) for smoother general streaming and reduced pop-in; Assets appear more quickly without excessive frame time cost.
TimeLimitStreamedPerFrameWhileLoading = 12.000000 		; Increased from default (8.0) for faster loading screens and smoother initial area loads. Only affects loading, not gameplay performance.

[Streaming/Culling]
StreamingQueryRoadDataMaxNN = 0							; Disables unnecessary road query overhead (default is 5) – reduces CPU usage.
VisibilityQueryActivationDistanceBoost = 35.0			; Reduced from default (40). Balanced visibility activation range to reduce late object activation without increasing pop-in.

[Streaming/Culling/Fallback]
DirectionTreshold = 0.465000							; Reduced from default (0.6) - Prevents assets from being culled/reloaded too frequently when panning the camera, for smoother transitions and improved 0.1% Lows.
PriorityTreshold = 0.2									; Lower than default (1.0) – reduces reliance on fallback, improving main query performance.

[Streaming/Culling/StaticDecals]
PosterDecalDistance = 35.0								; Keeps poster decals loaded for less time than default (40.0) while still minimizing visual popping.

[Streaming/Editor]
TimeLimitAttachingPerFrame = 15.000000 					; Increased to 15.0 - Gives the engine more time to attach assets, reducing visible pop-in (default is 10.0).
TimeLimitStreamedPerFrame = 20.000000 					; Raised to 20.0 - Gives a larger time budget for streaming data from disk per frame, ensuring assets load faster during high-speed travel (default is 12.0).

[Streaming/QueryZoom]
CullingAngleDegrees = 25.000000							; Reduced from default (30.0) to narrow streaming focus during zoom, improving performance and reducing micro-stutters; slight risk of pop-in near zoom edges.

