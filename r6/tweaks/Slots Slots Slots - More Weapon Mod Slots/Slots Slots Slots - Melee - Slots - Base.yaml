# Blade=======================================================

AttachmentSlots.Blade_WeaponMod3:
    $base: AttachmentSlots.Blade_WeaponMod1
    
AttachmentSlots.Blade_WeaponMod4:
    $base: AttachmentSlots.Blade_WeaponMod2

Items.Blade_WeaponMod3Element:
    $base: Items.Blade_WeaponMod1Element
    slot: AttachmentSlots.Blade_WeaponMod3
    
Items.Blade_WeaponMod4Element:
    $base: Items.Blade_WeaponMod2Element
    slot: AttachmentSlots.Blade_WeaponMod4

Items.Base_Blade_Blueprint_inline0:
    childElements:
        - !append-once Items.Blade_WeaponMod3Element
        - !append-once Items.Blade_WeaponMod4Element

