# MeleeMod=======================================================

Items.$(instance):
    $instances:
        - { instance: GenericMod1_Base }
        - { instance: GenericMod1_Common }
        - { instance: GenericMod1_Uncommon }
        - { instance: GenericMod1_Rare }
        - { instance: GenericMod1_Epic }
        - { instance: GenericMod1_Legendary }
        - { instance: ChimeraMeleeMod }
        - { instance: MeleeMod1_Base }
        - { instance: MeleeMod1_Common }
        - { instance: MeleeMod1_Uncommon }
        - { instance: MeleeMod1_Rare }
        - { instance: MeleeMod1_Epic }
        - { instance: MeleeMod1_Legendary }
        - { instance: MeleeMod2_Base }
        - { instance: MeleeMod2_Common }
        - { instance: MeleeMod2_Uncommon }
        - { instance: MeleeMod2_Rare }
        - { instance: MeleeMod2_Epic }
        - { instance: MeleeMod2_Legendary }
        - { instance: MeleeMod3_Base }
        - { instance: MeleeMod3_Common }
        - { instance: MeleeMod3_Uncommon }
        - { instance: MeleeMod3_Rare }
        - { instance: MeleeMod3_Epic }
        - { instance: MeleeMod3_Legendary }
    placementSlots:
        - !append-once AttachmentSlots.Blade_WeaponMod3
        - !append-once AttachmentSlots.Blade_WeaponMod4
        - !append-once AttachmentSlots.Blade_WeaponMod5
        - !append-once AttachmentSlots.Blade_WeaponMod6
        - !append-once AttachmentSlots.Blunt_WeaponMod3
        - !append-once AttachmentSlots.Blunt_WeaponMod4
        - !append-once AttachmentSlots.Blunt_WeaponMod5
        - !append-once AttachmentSlots.Blunt_WeaponMod6
        - !append-once AttachmentSlots.Throwable_WeaponMod3
        - !append-once AttachmentSlots.Throwable_WeaponMod4
        - !append-once AttachmentSlots.Throwable_WeaponMod5
        - !append-once AttachmentSlots.Throwable_WeaponMod6

