Items.mk78stats_damage:
  $type: gamedataConstantStatModifier_Record
  value: 120                                            #CHANGE DAMAGE VALUE - LOWER NUMBER=LOWER DAMAGE, HIGHER NUMBER=HIGHER DAMAGE.
  modifierType: Additive
  statType: BaseStats.DPS
  
Items.mk78stats_mag:
  $type: gamedataConstantStatModifier_Record
  value: 220                                          #CHANGE MAG SIZE - 0=DEFAULT (80 ROUNDS)  EXAMPLE: IF YOU WANT 150 ROUNDS YOU WOULD PUT "70" AS THE VALUE
  modifierType: Additive
  statType: BaseStats.MagazineCapacityBase
  
Items.mk78stats_rof:
  $type: gamedataConstantStatModifier_Record
  value: -0.02                                        #CHANGE RATE OF FIRE- HIGHER NUMBER=LOWER ROF, LOWER NUMBER=HIGHER ROF (TRY TO KEEP THIS VALUE BETWEEN "-0.25" AND "0.25")
  modifierType: Additive
  statType: BaseStats.CycleTimeBase
  
Items.mk78stats_pierce:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #ENAABLE WALL PIERCE ABILITY - 0=OFF, 1=ON
  modifierType: Additive
  statType: BaseStats.TechPierceEnabled
  
Items.mk78stats_fov:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE IRONSIGHT FOV- DEFAULT=0 (20 FOV)  HIGHER NUMBER=HIGHER FOV, LOWER NUMBER=LOWER FOV. EXAMPLE: IF YOU WANT 10 FOV YOU WOULD PUT "-10" AS THE VALUE
  modifierType: Additive
  statType: BaseStats.AimFOV

Items.mk78stats_scopefov:
  $type: gamedataConstantStatModifier_Record
  value: 0                                             #CHANGE SCOPE FOV- DEFAULT=0 (20 FOV)  HIGHER NUMBER=HIGHER FOV, LOWER NUMBER=LOWER FOV
  modifierType: Additive
  statType: BaseStats.ScopeFOV
  
Items.mk78stats_effectiverange:
  $type: gamedataConstantStatModifier_Record
  value: 30
  modifierType: Additive
  statType: BaseStats.EffectiveRange
  
