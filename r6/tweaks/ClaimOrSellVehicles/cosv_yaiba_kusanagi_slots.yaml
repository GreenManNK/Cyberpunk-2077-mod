# ClaimOrSellVehicles - Yaiba Kusanagi controlled garage records
# Combined Kusanagi backing file for CT-3X, Mizuchi/Tyger, and Misfit/Animals.
# Router policy belongs in init.lua; do not route baked-appearance records through COSV.
#
# Families in this file:
# - yaiba_kusanagi: CT-3X / normal / Mox / suburban skins
#   base: Vehicle.v_sportbike1_yaiba_kusanagi_player
#   10 appearances x 2 exact slots = 20 records, plus 2 overflow
# - yaiba_kusanagi_tyger: Mizuchi / Tyger skin
#   base: Vehicle.v_sportbike1_yaiba_kusanagi_tyger_player
#   1 appearance x 2 exact slots = 2 records
# - yaiba_kusanagi_animals: Misfit / Animals skins
#   base: Vehicle.v_sportbike1_yaiba_kusanagi_animal
#   3 appearances x 2 exact slots = 6 records
#
# Note:
# Vehicle.v_sportbike1_yaiba_kusanagi_animal is not player-capable and Twintone is not expected.
# This is intentional for Animals/Misfit because scanner identity preservation matters more here.

