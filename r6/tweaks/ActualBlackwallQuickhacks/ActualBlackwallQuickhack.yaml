  localizedDescription: It's hard to say what exactly makes this shard able to open temporary gates through the Blackwall. It could be a permaflux algorithm, or perhaps even more terrifyingly, it's capable of directly communicating with rogue AIs from beyond the Blackwall and somehow persuading them to open these gates.\n\nUnlocks the <Rich color="TooltipText.cyberwareDescriptionHighlightColor" style="Semi-Bold">Blackwall (single target)</> quickhack.\n\nThis quickhack causes <Rich color="TooltipText.cyberwareDescriptionHighlightColor" style="Semi-Bold">lethal damage</> to cyberware and neural systems.\n\nUnlocks the <Rich color="TooltipText.cyberwareDescriptionHighlightColor" style="Semi-Bold">Blackwall (multi target)</> quickhack.\n\nThis quickhack spreads and causes <Rich color="TooltipText.cyberwareDescriptionHighlightColor" style="Semi-Bold">lethal damage</> to cyberware and neural systems.
