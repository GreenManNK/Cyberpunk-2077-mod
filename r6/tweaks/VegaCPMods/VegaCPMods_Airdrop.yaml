# Airdrop loot table extension
# Adds cyberware capacity shards to the airdrop container loot tables


# Prerequirement max base humanity value
LootPrereqs.VegaCPMods_MaxHumanityPrereq:
  $type: gamedataStatPrereq_Record
  comparisonType: Less
  notifyOnAnyChange: False
  notifyOnlyOnStateFulfilled: False
  objectToCheck: Owner
  statType: Humanity
  valueToCheck: 450
  prereqClassName: StatPrereq
  statModifiers: []


LootTables.VegaCPMods_Airdrop_cc_shard:
  $type: gamedataLootItem_Record
  itemID: Items.AirdropPermaReward
  dropChance: 1
  dropCountMax: 1
  dropCountMin: 1


LootTables.VegaCPMods_Airdrop_cw_shard:
  $type: gamedataLootItem_Record

# Change the itemID value to one of the values below. Cyberware capacity increase by Uncommon = 2, Rare = 3, Epic = 4, Legendary = 6
# Items.CWCapacityPermaReward_2_Uncommon
# Items.CWCapacityPermaReward_2_Rare
# Items.CWCapacityPermaReward_2_Epic
# Items.CWCapacityPermaReward_2_Legendary

  itemID: Items.CWCapacityPermaReward_2_Epic
  dropChance: 1
  dropCountMax: 1
  dropCountMin: 1
  playerPrereqID: LootPrereqs.VegaCPMods_MaxHumanityPrereq


# Loot tables
LootTables.Regular_Airdrop_Loot:
  maxItemsToLoot: 7
  minItemsToLoot: 7
  lootItems:
    - !remove LootTables.Regular_Airdrop_Loot_inline0
    - !append LootTables.VegaCPMods_Airdrop_cc_shard
    - !append LootTables.VegaCPMods_Airdrop_cw_shard
LootTables.Treasure_Airdrop_Loot:
  maxItemsToLoot: 2
  minItemsToLoot: 2
  lootItems:
    - !append LootTables.VegaCPMods_Airdrop_cw_shard
