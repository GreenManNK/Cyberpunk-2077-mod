# Weapon stats
Items.3516custom5stats_damage:
  $type: gamedataConstantStatModifier_Record
  value: 8                                           #CHANGE DAMAGE VALUE - LOWER NUMBER=LOWER DAMAGE, HIGHER NUMBER=HIGHER DAMAGE.
  modifierType: Additive
  statType: BaseStats.DPS
  
Items.3516custom5stats_rof:
  $type: gamedataConstantStatModifier_Record
  value: 0.00                                        #CHANGE RATE OF FIRE- HIGHER NUMBER=LOWER ROF, LOWER NUMBER=HIGHER ROF (TRY TO KEEP THIS VALUE BETWEEN "-0.15" AND "0.15")
  modifierType: Additive
  statType: BaseStats.CycleTimeBase
  
Items.3516custom5stats_mag:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE MAG CAPACITY - 0=DEFAULT (10 ROUNDS)  EXAMPLE: IF YOU WANT 12 ROUNDS YOU WOULD PUT "2" AS THE VALUE
  modifierType: Additive
  statType: BaseStats.MagazineCapacityBase
  
Items.3516custom5stats_pierce:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #ENABLE/DISABLE WEAPON PIERCE - 0=DISABLED, 1=ENABLED
  modifierType: Additive
  statType: BaseStats.TechPierceEnabled
  
Items.3516custom5stats_crit:
  $type: gamedataConstantStatModifier_Record
  value: 5                                            #CHANGE CRIT CHANCE - THE NUMBER YOU INPUT WILL BE THE CRIT CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.CritChance
  
Items.3516custom5stats_stun:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE STUN CHANCE - THE NUMBER YOU INPUT WILL BE THE STUN CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.StunApplicationRate
  
Items.3516custom5stats_poison:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE POISON CHANCE - THE NUMBER YOU INPUT WILL BE THE POISON CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.PoisonedApplicationRate
  
Items.3516custom5stats_electrocute:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE ELECTROCUTE CHANCE - THE NUMBER YOU INPUT WILL BE THE ELECTROCUTE CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.ElectrocutedApplicationRate
  
Items.3516custom5stats_bleeding:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE BLEEDING CHANCE - THE NUMBER YOU INPUT WILL BE THE BLEEDING CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.BleedingApplicationRate
  
Items.3516custom5stats_burning:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE BURNING CHANCE - THE NUMBER YOU INPUT WILL BE THE BURNING CHANCE PERCENTAGE
  modifierType: Additive
  statType: BaseStats.BurningApplicationRate
  
Items.3516custom5stats_headshotmult:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #CHANGE HEADSHOT DAMAGE PERCENTAGE - 0=DEFAULT (150% Headshot Damage)  EXAMPLE: "-1.5=0%",  "-1=50%",  "-0.5=100%",  "0=150%",  "1=250%",  "2=350%",  "3=450%"
  modifierType: Additive
  statType: BaseStats.HeadshotDamageMultiplier

Items.3516custom5stats_spread:
  $type: gamedataConstantStatModifier_Record
  value: 0                                            #ENABLE/DISABLE ADS BULLET SPREAD - "-1=WEAPON SPREAD DISABLED",  "0=WEAPON SPREAD ENABLED"  ONLY EFFECTS BULLET SPREAD WHILE AIMING
  modifierType: Additive
  statType: BaseStats.SpreadUseInAds
  
Items.3516custom5stats_armor:
  $type: gamedataConstantStatModifier_Record
  value: 0.50                                        #CHANGE ARMOR PENETRATION PERCENTAGE - 0=DEFAULT (50% ARMOR PENETRATION)  EXAMPLE: "0=50%", "0.25=75%",  "0.50=100%"
  modifierType: Additive
  statType: BaseStats.CanWeaponIgnoreArmor


