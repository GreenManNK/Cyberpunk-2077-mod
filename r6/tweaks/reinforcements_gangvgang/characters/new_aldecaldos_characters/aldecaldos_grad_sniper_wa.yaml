Character.GR_adelcaldos_grad_sniper_wa:
    $base: Character.adelcaldos_grunt1_ranged1_nova_wa
    primaryEquipment: Character.GR_adelcaldos_grad_sniper_wa_primary_equipment
    archetypeData: ArchetypeData.FastSniperT3
    rarity: NPCRarity.Rare
    tags:
        - !append-once GRModPuppet
        - !append-once pcf_GangerCanRetreat

Character.GR_adelcaldos_grad_sniper_wa_primary_equipment:
    $type: gamedataNPCEquipmentGroup_Record
    equipmentItems:
        - Character.GR_adelcaldos_grad_sniper_wa_primary_item

Character.GR_adelcaldos_grad_sniper_wa_primary_item:
    $type: gamedataNPCEquipmentItem_Record
    equipSlot: AttachmentSlots.WeaponRight
    item: Items.Preset_Grad_Default
    onBodySlot: AttachmentSlots.ItemSlotGenericRanged
    equipCondition:
        - WeaponConditions.BaseRangedPrimaryWeaponEquipCondition
    unequipCondition:
        - WeaponConditions.BaseRangedPrimaryWeaponUnequipCondition
