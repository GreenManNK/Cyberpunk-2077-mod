# aldecaldos_burya_skirmisher_wa
Character.GR_adelcaldos_burya_skirmisher_wa:
    $base: Character.adelcaldos_grunt1_ranged1_pulsar_wa
    primaryEquipment: Character.GR_adelcaldos_burya_skirmisher_wa_primary_equipment
    archetypeData: ArchetypeData.FastRangedT3
    rarity: NPCRarity.Rare
    abilities:
        - !append-once Ability.CanUseGrenades
    tags:
        - !append-once GRModPuppet
        - !append-once pcf_GangerCanRetreat

Character.GR_adelcaldos_burya_skirmisher_wa_primary_equipment:
    $type: gamedataNPCEquipmentGroup_Record
    equipmentItems:
        - Character.GR_adelcaldos_burya_skirmisher_wa_primary_item

Character.GR_adelcaldos_burya_skirmisher_wa_primary_item:
    $type: gamedataNPCEquipmentItem_Record
    equipSlot: AttachmentSlots.WeaponRight
    item: Items.Preset_Burya_Default
    onBodySlot: AttachmentSlots.ItemSlotGenericRanged
    equipCondition:
        - WeaponConditions.BaseRangedPrimaryWeaponEquipCondition
    unequipCondition:
        - WeaponConditions.BaseRangedPrimaryWeaponUnequipCondition

