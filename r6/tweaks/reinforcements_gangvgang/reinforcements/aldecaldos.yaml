# Character.adelcaldos_grunt1_ranged1_pulsar_ma - pulsar
# Character.adelcaldos_grunt1_ranged1_pulsar_wa - pulsar
# Character.adelcaldos_grunt2_ranged2_copperhead_ma - copperhead
