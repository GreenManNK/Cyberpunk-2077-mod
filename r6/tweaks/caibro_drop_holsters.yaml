
# drop holster (black): Game.AddToInventory("Items.caibro_dholster_black",1)
Items.caibro_dholster_black:
  $base: Items.GenericLegClothing
  entityName: caibro_drop_holsters
  appearanceName: caibro_dholster_black_
  displayName: caibro_dholster_black_name
  localizedDescription: caibro_dholster_black_desc
  quality: Quality.Legendary
  placementSlots: 
    - !append OutfitSlots.ThighRight
  icon: UIIcon.caibro_dholster_black
  iconPath: caibro_dholster_black
UIIcon.caibro_dholster_black:
  $base: UIIcon.ItemIcon
  atlasResourcePath: base\caibro\icons\holster.icons.inkatlas
  atlasPartName: slot_1
  
