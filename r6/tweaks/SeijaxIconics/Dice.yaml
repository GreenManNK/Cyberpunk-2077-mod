Items.SND_Dice:
    $base: Items.Preset_Lexington_Default
    blueprint: Items.Iconic_Ranged_Weapon_Blueprint
    displayName: LocKey#SJ_Dice_name
    localizedDescription: LocKey#SJ_Dice_description
    appearanceResourceName: destinybu_lexington_app
    visualTags: [ Premium ]
    icon:
        atlasResourcePath: seijax\iconic_weapons\icons\icons.inkatlas
        atlasPartName: sj_dice
    triggerModes: [ TriggerMode.FullAuto, TriggerMode.Charge ]
    primaryTriggerMode: TriggerMode.FullAuto
    secondaryTriggerMode: TriggerMode.Charge
    fxPackage: WeaponFxPackage.PowerDiceFxPackage
    evolution: WeaponEvolution.Tech
    crosshair: Crosshairs.Tech_Simple
    statPools:
    -   !append-once BaseStatPools.WeaponCharge
    tags:
    -   !append-once IconicWeapon
    slotPartList:
    -   $base: Items.Base_Lexington_inline2
        itemPartList:
        -   $type: ItemPartListElement
            item: Items.SND_Dice__rcv1
    -   $base: Items.Base_Lexington_inline4
        itemPartList:
        -   $type: ItemPartListElement
            item: Items.SND_Dice__base1
    -   Items.Base_Lexington_inline6
    -   Items.Base_Lexington_inline8
    -   Items.HandgunPossibleScopesList
    -   Items.RangedWeaponPossibleMuzzleList
    -   Items.HandgunPossibleMuzzleBraksList
    slotPartListPreset:
    -   $base: Items.Preset_Base_Lexington_inline0
        itemPartPreset: Items.SND_Dice__rcv1
    -   $base: Items.Preset_Base_Lexington_inline1
        itemPartPreset: Items.SND_Dice__base1
    -   Items.Preset_Base_Lexington_inline2
    -   Items.Preset_Base_Lexington_inline3
    -   Items.HandgunAndRevolverScopesPartList
#    -   Items.Preset_Base_Lexington_inline4
#    -   Items.Preset_Base_Lexington_inline5
    -   $type: SlotItemPartPreset
        itemPartPreset: Items.SND_DiceWeaponMod
        slot: AttachmentSlots.IconicWeaponModLegendary
    statModifiers:
    -   !append-once Quality.IconicItem
    statModifierGroups:
    -   !append-once Items.IconicQualityRandomization
    -   !append-once Items.Base_Tech_Stats
    -   !append-once Items.SND_Dice_Tech_Stats
    -   !append-once Items.HalfSpreadStatModifierGroup

