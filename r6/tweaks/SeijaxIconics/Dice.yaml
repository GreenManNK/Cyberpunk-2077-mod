WeaponFxPackage.PowerDiceFxPackage:
    $base: WeaponFxPackage.PowerHandgun
#    vfx_impact_add_enable: true
#    vfx_impact_add: base\fx\weapons\impacts\_elemental\electric\imp_add_on_electric_shotgun.effect
    vfx_hitscan_trail: base\fx\weapons\trails\power\electric\w_trail_electric_power_pistol.effect
    NPC_vfx_hitscan_trail: base\fx\weapons\trails\power\electric\w_trail_electric_power_pistol.effect
    vfx_hitscan_trail_slowmo: base\fx\weapons\trails\power\electric\w_trail_electric_power_pistol.effect
    vfx_hitscan_trail_ricochet: base\fx\weapons\trails\power\electric\w_trail_electric_power_pistol.effect

QuickHack.DiceOverload:
    $base: QuickHack.CovertHack
    hackCategory: HackCategory.DamageHack
    actionName: Overload
    objectActionUI: Interactions.EMPOverloadHack
    costs: []
    activationTime: 
    -   $type: ConstantStatModifier
        statType: BaseStats.QuickHackUpload
        modifierType: Additive
        value: 0.0
    instigatorPrereqs: []
    startEffects: []
    completionEffects:
    -   !append
        $type: ObjectActionEffect
        statusEffect: 
            $base: BaseStatusEffect.OverloadLevel2
            gameplayTags:
            -   !append-once Stealth
        recipient: ObjectActionReference.Target
    -   !append-once QuickHack.OverloadControlQuickhackExtension
    -   !append 
        $type: ObjectActionEffect
        recipient: ObjectActionReference.Target
        effectorToTrigger: 
            $type: ApplyStatusEffectEffector
            prereqRecord:
                $type: StatusEffectPrereq
                objectToCheck: Target
                checkType: CheckType.Tag
                tagToCheck: PrimedWeakpoints
            statusEffect: BaseStatusEffect.WeakspotDestructionStatusEffect
    -   !append 
        $type: ObjectActionEffect
        recipient: ObjectActionReference.Target
        effectorToTrigger:
            $type: Effector
            prereqRecord:
                $base: Prereqs.ANDPrereq
                nestedPrereqs:
                -   BaseStatusEffect.NotJustDestroyedWeakspotPrereq
                -   $type: StatusEffectPrereq
                    objectToCheck: Target
                    checkType: CheckType.Tag
                    tagToCheck: PrimedWeakpoints
            effectorClassName: DestroyBreachEffector

Items.SND_DiceWeaponModAbility:
    $base: Items.IconicWeaponModAbilityBase
    UIData:
        $type: GameplayLogicPackageUIData
        localizedDescription: LocKey#SJ_Dice_iconic_description
    effectors:
    -   $type: ModifyStatPoolValueEffector
        prereqRecord:
            $type: StatusEffectPrereq
            objectToCheck: Player
            statusEffect: BaseStatusEffect.SJ_SwapFromSlice
        statPoolUpdates:
        -   $type: StatPoolUpdate
            statPoolType: BaseStatPools.Stamina
            statPoolValue: 50.0
        usePercent: true
    -   $base: Effectors.ApplyQuickhackEffector
        prereqRecord: Prereqs.SJ_ChargedShotHitOrMiss
        objectAction: QuickHack.DiceOverload
        uploadChance: 1.0
    -   $base: Effectors.TriggerAttackOnTargetEffect
        prereqRecord: Prereqs.SJ_ChargedShotHitOrMiss
        isRandom: true
        applicationChance: 1.0     
        attackRecord:
            $base: Attacks.BulletExplosion
            attackType: AttackType.Direct
            effectName: sj_iconic_effects
            effectTag: electric_hit
            hitFlags: [ Nonlethal ]
            range: 0.1
            hitReactionSeverityMin: 1
            hitReactionSeverityMax: 3
            statModifiers:
            -   Attacks.NullPhysicalDamage
#            -   $type: CombinedStatModifier
#                opSymbol: '*'
#                refObject: Owner
#                refStat: BaseStats.DamagePerHit
#                value: 1.0
#                modifierType: Additive
#                statType: BaseStats.ElectricDamage

Items.SND_DiceWeaponMod:
    $base: Items.IconicWeaponModBase
    OnAttach: [ Items.SND_DiceWeaponModAbility ]
    statModifiers:
    -   $type: ConstantStatModifier
        statType: BaseStats.BleedingApplicationRate
        modifierType: Additive
        value: 3.0
    -   $type: ConstantStatModifier
        statType: BaseStats.BurningApplicationRate
        modifierType: Additive
        value: 3.0
    -   $type: ConstantStatModifier
        statType: BaseStats.PoisonedApplicationRate
        modifierType: Additive
        value: 3.0
    -   $type: ConstantStatModifier
        statType: BaseStats.ElectrocutedApplicationRate
        modifierType: Additive
        value: 3.0
    -   $type: ConstantStatModifier
        statType: BaseStats.BulletMagnetismDefaultAngle
        modifierType: Multiplier
        value: 2.0
    -   $type: ConstantStatModifier
        statType: BaseStats.BulletMagnetismHighVelocityAngle
        modifierType: Multiplier
        value: 2.0

