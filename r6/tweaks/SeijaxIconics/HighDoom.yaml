Items.High_Doom__rcv1:
    $base: Items.w_revolver__malorian_overture__rcv1
    appearanceResourceName: seijax_highdoom_rcv

Items.High_Doom__base1:
    $base: Items.w_revolver__malorian_overture__base1
    appearanceResourceName: seijax_highdoom_base

Items.HighDoomWeaponModAbility:
    $base: Items.IconicWeaponModAbilityBase
    UIData:
        $type: GameplayLogicPackageUIData
        localizedDescription: LocKey#SJ_HighDoom_iconic_description
    effectors:
    -   $base: Perks.ApplyStatGroupOnWeapon
        prereqRecord: Perks.PlayerIsAiming
        statGroup:
            statModifiers:
            -   $type: ConstantStatModifier
                statType: BaseStats.CycleTimeBonus
                modifierType: Additive
                value: -0.5
            -   $type: ConstantStatModifier
                statType: BaseStats.RicochetCount
                modifierType: Multiplier
                value: 0.0
            -   $base: BaseStats.SmartGunTrackHeadComponentsModifier
                value: -2.0
            -   $base: BaseStats.SmartLinkDependentStatModifier
                statType: BaseStats.SmartGunHipLockingAnglePitch
                value: 6.0
            -   $base: BaseStats.SmartLinkDependentStatModifier
                statType: BaseStats.SmartGunHipLockingAngleYaw
                value: 15.0
            -   $base: BaseStats.SmartLinkDependentStatModifier
                statType: BaseStats.SmartGunHipTargetableAnglePitch
                value: 6.0
            -   $base: BaseStats.SmartLinkDependentStatModifier
                statType: BaseStats.SmartGunHipTargetableAngleYaw
                value: 15.0
            -   $base: BaseStats.SmartLinkDependentStatModifier
                statType: BaseStats.SmartGunAdsLockingAnglePitch
                value: 6.0
            -   $base: BaseStats.SmartLinkDependentStatModifier
                statType: BaseStats.SmartGunAdsLockingAngleYaw
                value: 15.0
            -   $base: BaseStats.SmartLinkDependentStatModifier
                statType: BaseStats.SmartGunAdsTargetableAnglePitch
                value: 6.0
            -   $base: BaseStats.SmartLinkDependentStatModifier
                statType: BaseStats.SmartGunAdsTargetableAngleYaw
                value: 15.0
            -   $base: BaseStats.SmartLinkDependentStatModifier
                statType: BaseStats.SmartGunHipTimeToUnlock
                value: 1.2
            -   $base: BaseStats.SmartLinkDependentStatModifier
                statType: BaseStats.SmartGunAdsTimeToUnlock
                value: 1.2
            -   $base: BaseStats.SmartLinkDependentStatModifier
                statType: BaseStats.SmartGunTimeToRemoveOccludedTarget
                value: 1.2
            -   $type: ConstantStatModifier
                statType: BaseStats.RecoilKickMin
                modifierType: Multiplier
                value: 0.0
            -   $type: ConstantStatModifier
                statType: BaseStats.RecoilKickMax
                modifierType: Multiplier
                value: 0.0
    -   $base: Perks.ApplyStatGroupOnWeapon
        prereqRecord: Perks.PlayerIsNotAiming
        statGroup:
            statModifiers:
            -   $type: ConstantStatModifier
                statType: BaseStats.ShouldIgnoreSmartUI
                modifierType: Additive
                value: 1.0
            -   $base: BaseStats.HitDismembermentFactorModifier
                value: 999.0
            -   $base: BaseStats.PhysicalImpulseModifier
                value: 20.0
            -   $base: BaseStats.KnockdownImpulseModifier
                value: 20.0
            -   $type: ConstantStatModifier
                statType: BaseStats.CycleTimeBonus
                modifierType: Additive
                value: -0.1

Items.HighDoomWeaponMod:
    $base: Items.IconicWeaponModBase
    OnAttach: [ Items.HighDoomWeaponModAbility ]
    statModifiers:
    -   $type: ConstantStatModifier
        statType: BaseStats.MagazineCapacityBonus
        modifierType: Additive
        value: 0.34
    -   $type: ConstantStatModifier
        statType: BaseStats.ZoomLevel
        modifierType: Multiplier
        value: 0.0
    -   $type: CombinedStatModifier
        statType: BaseStats.AimFOV
        modifierType: Multiplier
        refStat: BaseStats.AimFOV
        refObject: Root
        opSymbol: "inv"
        value: 40.0

