Attacks.HighDoomExplosiveBullet:
    $base: Attacks.ExplosiveBulletEffect
    explosionAttack:
        $base: Attacks.BulletExplosion
        hitReactionSeverityMin: 2
        hitReactionSeverityMax: 3

Attacks.HighDoomBulletFire:
    $type: RangedAttack
    playerAttack: Attacks.HighDoomExplosiveBullet
    secondaryPlayerAttack: Attacks.SmartBulletLow
    playerTimeDilated: Attacks.HighDoomExplosiveBullet
    secondaryPlayerTimeDilated: Attacks.SmartBulletLow

Attacks.HighDoomPackage:
    $type: RangedAttackPackage
    defaultFire: Attacks.HighDoomBulletFire
    chargeFire: Attacks.HighDoomBulletFire

Items.Preset_High_Doom:
    $base: Items.Preset_Overture_Default
#    audioName: wea_set_pozhar
    blueprint: Items.Iconic_Ranged_Weapon_NoAttachments_Blueprint
    displayName: LocKey#SJ_HighDoom_name
    localizedDescription: LocKey#SJ_HighDoom_description
    appearanceResourceName: seijax_highdoom_appfile
    visualTags: [ HighDoom ]
    quality: Quality.Common
    icon:
        atlasResourcePath: seijax\iconic_weapons\icons\icons.inkatlas
        atlasPartName: sj_highdoom
    tags:
    -   !append HighDoom
    -   !append ProtectedAttackPackage
    -   !append IconicWeapon
    crosshair: Crosshairs.SmartGun
    evolution: WeaponEvolution.Smart
    OnAttach:
    -   !append Items.SmartWeaponTargetsPriorityQueues
    triggerModes: [ TriggerMode.SemiAuto, TriggerMode.FullAuto ]
    primaryTriggerMode: TriggerMode.SemiAuto
    secondaryTriggerMode: TriggerMode.FullAuto
    rangedAttacks: Attacks.HighDoomPackage
    attacks:
    -   !append Attacks.HighDoomExplosiveBullet
    slotPartList:
    -   $base: Items.Base_Overture_inline1
        itemPartList:
        -   $type: ItemPartListElement
            item: Items.High_Doom__rcv1
    -   $base: Items.Base_Overture_inline3
        itemPartList:
        -   $type: ItemPartListElement
            item: Items.High_Doom__base1
    -   Items.Base_Overture_inline5
    -   Items.Base_Overture_inline7
#    -   Items.HandgunPossibleScopesList
    -   Items.RangedWeaponPossibleMuzzleList
    -   Items.HandgunPossibleMuzzleBraksList
    slotPartListPreset:
    -   $base: Items.Preset_Overture_Default_inline0
        itemPartPreset: Items.High_Doom__rcv1
    -   $base: Items.Preset_Overture_Default_inline1
        itemPartPreset: Items.High_Doom__base1
    -   Items.Preset_Overture_Default_inline2
    -   Items.Preset_Overture_Default_inline3
#    -   Items.HandgunAndRevolverScopesPartList
#    -   Items.Preset_Overture_Default_inline4
#    -   Items.Preset_Overture_Default_inline5
    -   $type: SlotItemPartPreset
        itemPartPreset: Items.HighDoomWeaponMod
        slot: AttachmentSlots.IconicWeaponModLegendary
    statModifierGroups:
    -   !append-once Items.Base_Smart_Stats
    -   !append-once Items.High_Doom_SmartGun_Stats
    -   !append-once Items.Base_Chao_SmartGun_Projectile_Stats
    -   !append-once Items.IconicQualityRandomization
    statModifiers:
    -   !append-once Quality.IconicItem
    -   !append-once Items.RRExplosivesControl

Items.SJ_HighDoom:
    $base: Items.Preset_High_Doom

Items.SJ_HighDoom_Shop:
    $base: Items.Preset_High_Doom
    quality: Quality.Random
    statModifierGroups:
    -   !remove Items.QualityRandomization

Vendors.wat_kab_junkshop_01:
    itemStock:
