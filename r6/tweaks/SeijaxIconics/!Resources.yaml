        value: 0.5
    -   $type: ConstantStatModifier
        statType: BaseStats.SpreadDefaultY
        modifierType: Multiplier
        value: 0.5
    -   $type: ConstantStatModifier
        statType: BaseStats.SpreadMaxX
        modifierType: Multiplier
        value: 0.5
    -   $type: ConstantStatModifier
        statType: BaseStats.SpreadMaxY
        modifierType: Multiplier
        value: 0.5
    -   $type: ConstantStatModifier
        statType: BaseStats.SpreadAdsDefaultX
        modifierType: Multiplier
        value: 0.0
    -   $type: ConstantStatModifier
        statType: BaseStats.SpreadAdsDefaultY
        modifierType: Multiplier
        value: 0.0
    -   $type: ConstantStatModifier
        statType: BaseStats.SpreadAdsMaxX
        modifierType: Multiplier
        value: 0.0
    -   $type: ConstantStatModifier
        statType: BaseStats.SpreadAdsMaxY
        modifierType: Multiplier
        value: 0.0

Prereqs.SJ_IsDefeated:
    $base: Prereqs.ORPrereq
    nestedPrereqs:
    -   $type: StatusEffectPrereq
        statusEffect: BaseStatusEffect.Defeated
        checkType: CheckType.Type
    -   $type: StatusEffectPrereq
        statusEffect: BaseStatusEffect.Unconscious
        checkType: CheckType.Type
    -   $type: StatusEffectPrereq
        statusEffect: BaseStatusEffect.SystemCollapse
        checkType: CheckType.Type
    -   $type: StatPoolPrereq
        statPoolType: Health
        comparisonType: Equal
        valueToCheck:
        -   $type: ConstantStatModifier
            statType: BaseStats.Health
            modifierType: Additive
            value: 0.0

Prereqs.IsAttackRangedHeadshot:
    $base: Perks.IsAttackRanged
    conditions:
    -   !append
        $base: Prereqs.BodyPartHitPrereqCondition
        bodyPart: Head

Prereqs.SJ_ChargedShotHitOrMiss: 
    $base: Prereqs.ORPrereq
    nestedPrereqs:
    -   $base: Prereqs.MicroGeneratorShotPrereq
        conditions:
        -   !append
            $base: Prereqs.HitFlagHitPrereqCondition
            hitFlag: WeaponFullyCharged
    -   $base: Prereqs.MicroGeneratorShotPrereq
        conditions:
        -   !append
            $base: Prereqs.HitFlagHitPrereqCondition
            hitFlag: PerfectlyCharged

Prereqs.SJ_ChargedShotHit: 
    $base: Prereqs.ORPrereq
    nestedPrereqs:
    -   $base: Perks.IsAttackRanged
        conditions:
        -   !append
            $base: Prereqs.HitFlagHitPrereqCondition
            hitFlag: WeaponFullyCharged
    -   $base: Perks.IsAttackRanged
        conditions:
        -   !append
            $base: Prereqs.HitFlagHitPrereqCondition
            hitFlag: PerfectlyCharged

