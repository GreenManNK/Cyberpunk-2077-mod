WeaponFxPackage.SJ_GhostBladeFxPackage:
    $type: WeaponFxPackage

Items.SJ_GhostBlade:
    $base: Items.Preset_Katana_Default
    displayName: LocKey#SJ_GhostBlade_name
    localizedDescription: LocKey#SJ_GhostBlade_description
    appearanceResourceName: seijax_ghostblade_app
    icon:
        atlasResourcePath: seijax\iconic_weapons\icons\icons.inkatlas
        atlasPartName: sj_ghostblade
    blueprint: Items.Iconic_Melee_Blueprint
    fxPackage: WeaponFxPackage.SJ_GhostBladeFxPackage
    tags:
    -   !append-once IconicWeapon
    -   !remove ForceDismember
    npcRPGData:
        $base: Items.Base_Katana_NPC_Data
        statModifiers:
        -   !append Quality.IconicItem
        statModifierGroups:
        -   !append-once Items.IconicQualityRandomization
        -   !remove Items.NPCQualityRandomization
    quality: Quality.Rare
    slotPartListPreset:
    -   Items.Preset_Katana_Default_inline0
    -   $type: SlotItemPartPreset
        itemPartPreset: Items.SJ_GhostBladeWeaponMod
        slot: AttachmentSlots.IconicMeleeWeaponMod1
    statModifiers:
    -   !append-once Quality.IconicItem
    statModifierGroups:
    -   !append-once Items.IconicQualityRandomization
    -   !remove Items.Base_Melee_Status_Effect_Application_Stats

Items.SJ_GhostBlade_Pickup:
    $base: Items.SJ_GhostBlade
    quality: Quality.Random
    statModifierGroups:
    -   !remove Items.QualityRandomization

Items.SJ_GhostBlade_Off:
    $base: Items.SJ_GhostBlade
    visualTags: [ Off ]

