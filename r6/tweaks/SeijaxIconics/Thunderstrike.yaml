Attacks.SJ_ThunderstrikeCharge:
    $base: Attacks.Bullet_GameEffect
    explosionAttack:
        $base: Attacks.BaseExplosion
        playerIncomingDamageMultiplier: 0.20
        effectTag: emp_explosion
        range: 5.0
        statModifiers:
        -   $type: CombinedStatModifier
            refStat: BaseStats.DamagePerHit
            statType: BaseStats.ElectricDamage
            modifierType: Additive
            refObject: Owner
            opSymbol: "*"
            value: 1.0
        hitFlags:
        -   !append-once DetonateGrenades
        -   !append-once BulletExplosion
        hitReactionSeverityMin: 2
        explosionDamageVSVehicles: 50.0
        statusEffects:
        -   $type: StatusEffectAttackData
            statusEffect: BaseStatusEffect.EMPMalfunctionCripple
            applyImmediately: true
        -   $type: StatusEffectAttackData
            statusEffect: BaseStatusEffect.Stun
            applyImmediately: true

Attacks.SJ_ThunderstrikeChargedFire:
    $type: RangedAttack
    playerAttack: Attacks.Bullet_GameEffect
    secondaryPlayerAttack: Attacks.SJ_ThunderstrikeCharge
    playerTimeDilated: Attacks.Bullet_GameEffect
    secondaryPlayerTimeDilated: Attacks.SJ_ThunderstrikeCharge

Attacks.SJ_ThunderstrikeAttackPackage:
    $type: RangedAttackPackage
    defaultFire: Attacks.PhysicalBullet
    chargeFire: Attacks.SJ_ThunderstrikeChargedFire

Items.SJ_Thunderstrike:
    $base: Items.Preset_Nekomata_Default
    blueprint: Items.Iconic_Ranged_Weapon_NoMuzzle_Blueprint
    displayName: LocKey#SJ_Thunderstrike_name
    localizedDescription: LocKey#SJ_Thunderstrike_description
    gameplayDescription: LocKey#92668
    appearanceResourceName: seijax_thunderstrike_appfile
    icon:
        atlasResourcePath: seijax\iconic_weapons\icons\icons.inkatlas
        atlasPartName: sj_thunderstrike
    audioName: wea_set_quasar
    itemType: ItemType.Wea_LightMachineGun
    ammo: Ammo.RifleAmmo
    crosshair: Crosshairs.Tech_Simple
    triggerModes: [ TriggerMode.Charge, TriggerMode.Charge ]
    primaryTriggerMode: TriggerMode.Charge
    secondaryTriggerMode: TriggerMode.Charge
    rangedAttacks: Attacks.SJ_ThunderstrikeAttackPackage
    attacks:
    -   !append Attacks.SJ_ThunderstrikeCharge
    -   !append-once Attacks.Bullet_GameEffect
    npcRPGData:
        $base: Items.Base_Nekomata_NPC_Data
        statModifiers:
        -   !append Quality.IconicItem
        statModifierGroups:
        -   !append-once Items.IconicQualityRandomization
        -   !remove Items.NPCQualityRandomization
    quality: Quality.Rare
    tags:
    -   !append IconicWeapon
    -   !append ManualTriggerSwap
    -   !append UnslowableChargeSecondary
#    -   !append ForceInstantDischargePrimary
    OnAttach:
    -   !remove EquipmentGLP.HeavyWeapon
    -   !remove EquipmentGLP.HeavyStaminaDelay
    -   !append-once EquipmentGLP.HeavyLMGWeapon
    -   !append-once EquipmentGLP.MediumStaminaDelay
    slotPartList:
    -   $base: Items.Base_Nekomata_inline1
        itemPartList:
        -   $type: ItemPartListElement
            item: Items.SJ_Thunderstrike__rcv
    -   $base: Items.Base_Nekomata_inline3
        itemPartList: 
        -   $type: ItemPartListElement
            item: Items.SJ_Thunderstrike__base
    -   $base: Items.Base_Nekomata_inline5
        itemPartList:
        -   $type: ItemPartListElement
            item: Items.SJ_Thunderstrike__std
    -   $base: Items.Base_Nekomata_inline7
        itemPartList:
        -   $type: ItemPartListElement
            item: Items.SJ_Thunderstrike__stdr
    -   Items.RiflePossibleScopesList
    slotPartListPreset:
    -   $base: Items.Preset_Nekomata_Default_inline0
        itemPartPreset: Items.SJ_Thunderstrike__rcv
    -   $base: Items.Preset_Nekomata_Default_inline1
        itemPartPreset: Items.SJ_Thunderstrike__base
    -   $base: Items.Preset_Nekomata_Default_inline2
        itemPartPreset: Items.SJ_Thunderstrike__std
    -   $base: Items.Preset_Nekomata_Default_inline3
        itemPartPreset: Items.SJ_Thunderstrike__stdr
    -   $base: Items.Preset_Nekomata_Default_inline4
        itemPartPreset: 
            $base: Items.w_att_scope_long_04
            appearanceName: default
    -   $type: SlotItemPartPreset
        itemPartPreset: Items.ThunderstrikeWeaponMod
        slot: AttachmentSlots.IconicWeaponModLegendary
    statModifiers:
    -   !append-once Quality.IconicItem
    -   !append
        $base: BaseStats.CycleTimeModifier
        value: -0.35
    -   !append
        $base: BaseStats.MagazineCapacityModifier
        value: 46.0
    statModifierGroups:
    -   !append-once Items.IconicQualityRandomization
    -   !remove Items.Base_Nekomata_Handling_Stats
    -   !append
        $base: Items.Base_Nekomata_Handling_Stats
        statModifiers:
        -   !remove Items.Base_Nekomata_Handling_Stats_inline6

