BaseStatusEffect.EMPMalfunctionCripple:
    $base: BaseStatusEffect.LocomotionMalfunction
    duration:
        statModifiers:
        -   $type: ConstantStatModifier
            statType: BaseStats.MaxDuration
            modifierType: Additive
            value: 4.6
    gameplayTags:
    -   Debuff
    -   LocomotionMalfunction
    immunityStats:
    -   BaseStats.StunImmunity
    VFX:
    -   !append
        $type: StatusEffectFX
        name: status_electrocuted
    SFX: []

Items.ThunderstrikeWeaponModAbility:
    $base: Items.IconicWeaponModAbilityBase
    UIData:
        $type: GameplayLogicPackageUIData
        localizedDescription: LocKey#SJ_Thunderstrike_iconic_description
    effectors:
    -   $base: Perks.ApplyStatGroupOnWeapon
        prereqRecord: Prereqs.IsPrimaryTrigger
        statGroup:
            $type: StatModifierGroup
            statModifiers:
            -   $type: ConstantStatModifier
                statType: BaseStats.FullAutoOnFullCharge
                modifierType: Additive
                value: 1.0
            -   $type: ConstantStatModifier
                statType: BaseStats.TechPierceChargeLevel
                modifierType: Multiplier
                value: 0.0
            -   $type: ConstantStatModifier
                statType: BaseStats.ChargeTime
                modifierType: Multiplier
                value: 0.5
            -   $type: ConstantStatModifier
                statType: BaseStats.NumShotsInBurstMaxCharge
                modifierType: Additive
                value: 1.0
            -   $type: ConstantStatModifier
                statType: BaseStats.CycleTime_BurstMaxCharge
                modifierType: Additive
                value: 0.01
            -   $type: ConstantStatModifier
                statType: BaseStats.ChargeMultiplier
                modifierType: Multiplier
                value: 0.0
            -   $type: ConstantStatModifier
                statType: BaseStats.ChargeFullMultiplier
                modifierType: Multiplier
                value: 0.0
            -   $type: ConstantStatModifier
                statType: BaseStats.RecoilCycleTime
                modifierType: Multiplier
                value: 0.5
            -   $type: ConstantStatModifier
                statType: BaseStats.RecoilKickMin
                modifierType: Multiplier
                value: 0.2
            -   $type: ConstantStatModifier
                statType: BaseStats.RecoilKickMax
                modifierType: Multiplier
                value: 0.2
            -   $type: ConstantStatModifier
                statType: BaseStats.RecoilChargeMult
                modifierType: Multiplier
                value: 0.0
            -   $type: ConstantStatModifier
                statType: BaseStats.RecoilFullChargeMult
                modifierType: Multiplier
                value: 0.0
    -   $base: Perks.ApplyStatGroupOnWeapon
        prereqRecord: Prereqs.IsSecondaryTrigger
        statGroup:
            statModifiers:
            -   $type: ConstantStatModifier
                statType: BaseStats.ChargeTime
                modifierType: Additive
                value: 1.0
            -   $type: ConstantStatModifier
                statType: BaseStats.ChargeMultiplier
                modifierType: Additive
                value: 0.75
            -   $type: ConstantStatModifier
                statType: BaseStats.ChargeFullMultiplier
                modifierType: Additive
                value: 0.75
            -   $type: ConstantStatModifier
                statType: BaseStats.ChargeReadyPercentage
                modifierType: Multiplier
                value: 0.75

Items.ThunderstrikeWeaponMod:
